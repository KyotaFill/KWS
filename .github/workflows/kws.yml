name: KWS checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb postgresql nginx graphviz poppler-utils
      - run: python -m pip install -r requirements-app-lock.txt && python -m pip install -e '.[server,desktop,dev]'
      - run: xvfb-run -a python scripts/check_application.py --gui --jobs 4
      - run: python scripts/check_application.py --test-path deploy/lan/tests --report .reports/deployment.xml
      - run: python -m ruff check apps packages tests scripts
      - run: python scripts/export_runtime_contract.py --check
      - run: python scripts/check_report_current.py && python scripts/check_diagram_notation.py && python scripts/check_artifacts.py
